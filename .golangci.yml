version: "2"
run:
  timeout: 2m
  modules-download-mode: readonly
  relative-path-mode: wd
  allow-serial-runners: true
  build-tags:
    - mage
    - integration

linters:
  enable:
    - errcheck
    - err113
    - govet
    - ineffassign
    - staticcheck
    - unused
    - sloglint
    - errorlint
    - bodyclose
    - gosec
    - noctx
    - unparam
    - gocyclo
    - gocognit
    - funlen
    - lll
    - cyclop
    - revive
    - goconst
    - nakedret
    - copyloopvar
    - gomodguard
    - godox
    - godot
    - testifylint
    - mnd
    - exhaustive
    - gocritic
    - varnamelen
    - depguard
    - forbidigo
  settings:
    govet:
      enable:
        - shadow
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    gocyclo:
      min-complexity: 10
    cyclop:
      max-complexity: 12
      package-average: 4
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    lll:
      line-length: 120
      tab-width: 1
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: true
              skipBlankLines: true
        - name: var-naming
          arguments:
            - ["ID", "URL", "HTTP", "JSON", "XML", "API", "UUID"]
            - []
            - - skip-initialism-name-checks: false
                upper-case-const: false
        - name: receiver-naming
    goconst:
      min-len: 3
      min-occurrences: 3
    godox:
      keywords:
        - TODO
        - FIXME
        - BUG
        - OPTIMIZE
        - HACK
    godot:
      period: false
      capital: false
    testifylint:
      enable:
        - bool-compare
        - compares
        - empty
        - error-is-as
        - len
        - expected-actual
        - suite-dont-use-pkg
        - suite-extra-assert-call
    mnd:
      checks:
        - argument
        - condition
        - operation
        - return
    gocritic:
      enabled-tags:
        - performance
        - style
        - diagnostic
    varnamelen:
      min-name-length: 2
    depguard:
      rules:
        # Keep in sync with exclusions.rules forbidigo path-except (same test/BDD/fake trees).
        test-isolation:
          files:
            - "$test"
            - "features/**/*.go"
            - "cmdtest/**/*.go"
            - "gatetest/**/*.go"
          deny:
            - pkg: net
              desc: "Unit tests must not use raw network primitives"
            - pkg: net/http
              desc: "Unit tests must not import the HTTP stack"
            - pkg: net/http/httputil
              desc: "Unit tests must not use reverse-proxy HTTP plumbing"
            - pkg: crypto/tls
              desc: "Unit tests must not use TLS directly"
            - pkg: os/exec
              desc: "Unit tests must not spawn subprocesses"
            - pkg: syscall
              desc: "Unit tests must not import syscall"
            - pkg: io/ioutil
              desc: "io/ioutil is deprecated; use io/os from production code"
            - pkg: os
              desc: "Unit tests must not import os; use io/fs types, injected fileOps/fs.FS"
        library-internals:
          files:
            - "internal/harness/**/*.go"
            - "internal/gatecheck/**/*.go"
          deny:
            - pkg: os
              desc: "library internals must use FileOps (afero); os is only allowed in boundary packages"
            - pkg: os/exec
              desc: "library internals must use CommandRunner; os/exec is only allowed in cmdrunner"
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^testing\.T\.TempDir$
          msg: "Unit tests must not use t.TempDir; use fstest.MapFS / in-memory fakes"
        - pattern: ^os\.(Getwd|WriteFile|ReadFile|Open|OpenFile|Create|CreateTemp|Mkdir|MkdirAll|MkdirTemp|Remove|RemoveAll|Rename|Chdir|Truncate|Stat|Lstat)$
          msg: "Unit tests must not call os file I/O; use io/fs"
        - pattern: ^time\.Sleep$
          msg: "Unit tests must not use time.Sleep; prefer deterministic synchronization"
        - pattern: ^strings\.Contains$
          msg: "use strings.HasPrefix, strings.HasSuffix, strings.EqualFold, or exact match instead of strings.Contains in tests"
        - pattern: ^(httptest\.(NewServer|NewTLSServer|NewUnstartedServer))$
          msg: "Unit tests must not create listener-backed servers; use NewRecorder"
        - pattern: ^(net\.(Listen|Dial|DialContext|DialTimeout))$
          msg: "Unit tests must not perform network I/O; use fakes"
        # Production entrypoints: unit tests and BDD must never wire real subprocess/stdio/logging bundles.
        # forbidigo scope matches depguard.rules.test-isolation.files: $test + features + cmdtest + gatetest.
        - pattern: ^afero\.NewOsFs$
          msg: "tests must not use afero's OS backend; use gatetest.NewMemoryFileOps()"
        - pattern: ^(gate|cmdrunner)\.NewProductionRunner$
          msg: "inject a fake CommandRunner; do not construct the production runner"
        - pattern: ^gate\.NewProductionFileOps$
          msg: "inject a fake FileOps; do not construct the production filesystem in tests"
        - pattern: ^(gate|cmdrunner)\.NewProductionToolResolver$
          msg: "inject a fake ToolResolver; do not construct the production resolver in tests"
  exclusions:
    generated: lax
    # path-except = exception to suppression: forbidigo still runs on matches (not "skip linting here").
    # path = suppress listed linters on matches. [\\/] = paths may be / or \ (do not assume normalization).
    rules:
      # Matches depguard test-isolation.files ($test + features + cmdtest + gatetest).
      - path-except: '(^features[\\/].*\.go$|^cmdtest[\\/].*\.go$|^gatetest[\\/].*\.go$|.*_test\.go$)'
        linters:
          - forbidigo
      - path: '^integration[\\/]examplecheck[\\/].*_test\.go$'
        linters:
          - depguard
          - forbidigo
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true